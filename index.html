  --cn:#A32A18; --cn-bg:#FDECE8; --cn-mid:#EBA79C;
  --jp:#4B3A8F; --jp-bg:#EFEAFB; --jp-mid:#B9A8EC;
  --warn:#7A4B00; --warn-bg:#FFF0E0; --ok:#1F7A5A; --ok-bg:#E3F5EE; --lilac:#EFE6FB;
  --desk:#F3EEF1; --desk-ink:#2B2230;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
svg{flex-shrink:0}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.intro{width:340px;display:flex;flex-direction:column;gap:20px;color:var(--desk-ink)}
.intro .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.intro h1{margin:0;font-size:30px;line-height:1.35;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.intro p{margin:0;font-size:15px;line-height:1.7;color:var(--sub)}
.qrbox{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:16px}
.qrbox img{width:120px;height:120px;image-rendering:pixelated;border-radius:8px}
.qrbox .qrtxt{font-size:13px;line-height:1.6;color:var(--sub)}
.qrbox .qrtxt strong{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.jump{display:flex;flex-direction:column;gap:8px}
.jump .lbl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.jump .list{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px}
.jump button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700}
.reset{align-self:flex-start;border:none;background:none;padding:4px 0;font-size:13px;color:var(--mute);text-decoration:underline}

.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #1d171f,0 30px 70px rgba(43,34,48,.28);flex-shrink:0}
#app{height:100%}

@media (max-width:760px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .intro{display:none}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* ---------- app primitives ---------- */
.scr{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.scr.white{background:var(--card)}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:20px 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top h1{margin:0;font-size:18px;font-weight:700}
.ib{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;padding:0;border-radius:12px}
.cta{display:block;width:100%;text-align:center;border:none;background:var(--rose);color:#fff;font-size:16px;font-weight:700;padding:16px 0;border-radius:16px}
.cta:active{background:var(--rose-deep)}
.cta.ghost{background:none;color:var(--rose);font-weight:500;font-size:14px;padding:12px 0}
.foot{flex-shrink:0;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border-radius:20px;padding:14px}
.pill{flex:1;height:40px;border-radius:999px;font-size:13px;border:1.5px solid var(--line);background:var(--card);font-weight:500;padding:0 6px;white-space:nowrap}
.pill.on{border-color:var(--rose-soft);background:var(--blush);color:var(--rose-deep);font-weight:700}
.row{display:flex;gap:6px}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-KR{background:var(--kr-bg);color:var(--kr)} .c-CN{background:var(--cn-bg);color:var(--cn)} .c-JP{background:var(--jp-bg);color:var(--jp)}
.sec{font-size:15px;font-weight:700}
.muted{color:var(--sub)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:44px;border:none;background:none;font-size:14px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mute);font-weight:500}
.tabs button.on{border-bottom-color:var(--rose);color:var(--rose-deep);font-weight:700}
.link{border:none;background:none;padding:0;color:var(--rose);font-size:13px;font-weight:700}

/* bottom nav */
.nav{flex-shrink:0;height:72px;border-top:1px solid var(--line);display:flex;background:var(--card)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--mute);font-size:11px;padding:0}
.nav button.on{color:var(--rose);font-weight:700}
.nav .plus{width:48px;height:48px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(194,63,104,.3)}

/* splash */
.splash{height:100%;background:linear-gradient(180deg,#FFF6F9 0%,#FCE1EA 100%);display:flex;flex-direction:column;align-items:center;padding:12vh 28px 28px;gap:18px;overflow-y:auto}
.splash .name{font-size:38px;font-weight:900;letter-spacing:-.02em}
.flags{display:flex;gap:18px;margin-top:36px}
.flag{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.flag b{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(194,63,104,.12);font-size:16px;font-weight:900}
.splash .logo{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.flag:nth-child(1){animation:rise .5s .15s both}.flag:nth-child(2){animation:rise .5s .25s both;margin-top:20px}.flag:nth-child(3){animation:rise .5s .35s both}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.3}to{transform:none;opacity:1}}

/* search */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 18px;height:46px}
.search input{border:none;background:transparent;font-size:14px;flex:1;outline:none;min-width:0}
.results{display:flex;flex-direction:column;background:#fff;border-radius:16px;padding:4px 12px}
.results button{display:flex;align-items:center;gap:10px;border:none;background:none;padding:10px 0;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.results button:last-child{border-bottom:none}

.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;font-size:12px;padding:0}
.cats i{width:50px;height:50px;border-radius:18px;display:flex;align-items:center;justify-content:center}

.banner{border:none;text-align:left;width:100%;background:linear-gradient(120deg,#FCE1EA 0%,#EFE6FB 100%);border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.rank{display:flex;gap:12px;align-items:center;padding:6px 0;border:none;background:none;width:100%;text-align:left}
.bottle{width:44px;height:44px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center}

/* compare */
.cmp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp-prod{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.thumb{width:64px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.cell{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.4}
.rowlbl{font-size:12px;font-weight:700;color:var(--sub);padding:0 4px}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose-soft);border-radius:3px;transition:width .5s}
.ai{background:var(--blush);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;color:#5C1F33}

/* detail */
.hero{height:280px;flex-shrink:0;background:linear-gradient(180deg,#FCE1EA 0%,#FFF6F9 100%);position:relative;display:flex;align-items:center;justify-content:center}
.hero .ib{position:absolute;top:12px}
.cap{width:34px;height:30px;border-radius:8px 8px 2px 2px;background:var(--rose-soft)}
.btl{width:110px;height:160px;border-radius:28px;background:#fff;box-shadow:0 16px 40px rgba(194,63,104,.18);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--rose-soft);letter-spacing:.1em}
.heart.beat{animation:beat .35s}
@keyframes beat{50%{transform:scale(1.3)}}
.score3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score3 div{border-radius:14px;padding:8px 0;text-align:center}
.score3 small{display:block;font-size:11px;font-weight:700}
.score3 b{font-size:15px;font-weight:900}
.note{background:var(--warn-bg);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;color:#4A2E00}
.ing{font-size:13px;padding:7px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.ing.w{background:var(--warn-bg);color:var(--warn)}

/* reviews */
.switch{width:50px;height:30px;border-radius:999px;border:none;padding:3px;display:flex;background:#D9D2D6;transition:background .2s}
.switch span{width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--rose)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.rv{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rv p{margin:0;font-size:14px;line-height:1.6}
.av{width:38px;height:38px;border-radius:50%}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
.photos{display:flex;gap:6px}
.photos div,.photos img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.help{border:none;background:none;padding:4px 0;font-size:12px;font-weight:700;color:var(--rose-deep)}
.help.on{color:var(--rose)}
.empty{text-align:center;padding:30px 0;color:var(--sub);font-size:14px}

/* shops */
.shop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid #fff}
.shop.on{border-color:var(--rose-soft);box-shadow:0 6px 18px rgba(194,63,104,.14)}

/* write */
textarea{resize:none;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6;background:#fff;width:100%;outline:none}
textarea:focus{border-color:var(--rose-soft)}
.addph{width:76px;height:76px;border-radius:16px;border:1.5px dashed var(--rose-soft);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--rose-deep);font-size:11px;flex-shrink:0}
.ph{position:relative;flex-shrink:0}
.ph img{width:76px;height:76px;border-radius:16px;object-fit:cover;display:block}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:14px;line-height:1;padding:0}
.err{font-size:12px;color:var(--rose);font-weight:700}
.star{width:28px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}

/* my */
.prof{background:linear-gradient(120deg,#FCE1EA 0%,#EFE6FB 100%);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stat{background:#fff;border-radius:14px;padding:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:16px;font-weight:900}
.stat small{font-size:11px;color:var(--sub)}
.li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;border:none;width:100%;text-align:left}
.menu{background:#fff;border-radius:16px;display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;padding:13px 16px;border:none;background:none;font-size:14px;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:none}

/* onboarding */
.typegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.typegrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-radius:16px;font-size:14px;border:1.5px solid var(--line);background:#fff;font-weight:500}
.typegrid button.on{border-color:var(--rose-soft);background:var(--blush);color:var(--rose-deep);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:500}
.chips button.on{border-color:var(--rose-soft);background:var(--blush);color:var(--rose-deep);font-weight:700}
.ctry{flex:1;font-size:14px;font-weight:700;padding:12px 0;border-radius:14px;border:2px solid transparent;opacity:.45}
.ctry.on{opacity:1}
.ctry.c-KR.on{border-color:var(--kr-mid)}.ctry.c-CN.on{border-color:var(--cn-mid)}.ctry.c-JP.on{border-color:var(--jp-mid)}
.prog{height:6px;border-radius:3px;background:var(--line)}
.prog i{display:block;height:6px;border-radius:3px;background:var(--rose-soft);transition:width .3s}

/* toast + sheet */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:rgba(43,34,48,.92);color:#fff;font-size:13px;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:calc(100% - 40px);text-align:center;line-height:1.5;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:absolute;inset:0;background:rgba(43,34,48,.4);display:flex;align-items:flex-end;z-index:30}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 20px 24px;display:flex;flex-direction:column;gap:12px;animation:up .25s}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;font-size:14px;line-height:1.6;color:var(--sub)}
@keyframes up{from{transform:translateY(40px)}}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:.4;transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="stage">
  <aside class="intro" aria-label="체험 안내">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#E07A9C"/><circle cx="60" cy="62" r="34" fill="none" stroke="#fff" stroke-width="7"/><ellipse cx="60" cy="62" rx="14" ry="34" fill="none" stroke="#fff" stroke-width="6"/><path d="M27 52h66M27 72h66" stroke="#fff" stroke-width="6"/></svg>GlowAround</div>

    <div class="qrbox" id="qrbox" hidden>
      <img id="qrimg" alt="체험판 QR 코드">
      <div class="qrtxt"><strong>휴대폰으로 체험하기</strong>카메라로 QR을 찍으면<br>앱처럼 전체 화면으로 열려요.</div>
    </div>
    <div class="jump">
      <span class="lbl">화면 바로가기</span>
      <div class="list" id="jump"></div>
    </div>
    <button class="reset" type="button" data-act="reset">처음 상태로 되돌리기</button>
  </aside>
  <div class="phone">
    <div id="app"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}
function sheet(title,body,btn,act){const d=document.createElement('div');d.className='sheet-bg';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${title}</h2><p>${body}</p><button class="cta" type="button" data-sheet="${act}">${btn}</button><button class="cta ghost" type="button" data-sheet="close">닫기</button></div>`;document.querySelector('.phone').appendChild(d);}

V.write=()=>{
  const p=P[S.cur];
  const pill=(on)=>`pill ${on?'on':''}`;
  return `<div class="scr"><div class="body" style="padding:14px 16px 16px">
  ${topBar('후기 작성','home',I.close)}
  <div class="card" style="border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center"><div style="width:44px;height:52px;border-radius:12px;background:var(--petal)"></div>
    <div style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="muted" style="font-size:11px">${CN_[p.c]} · [${p.c} 브랜드]</span><span style="font-size:14px;font-weight:700">${p.name}</span></div>
    <div style="display:flex">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-star="${n}" aria-label="별점 ${n}점">${I.star(n<=S.star)}</button>`).join('')}</div></div>
  <div style="display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px">
    <label class="addph" for="ph" ${S.photos.length>=5?'hidden':''}>${I.cam}${S.photos.length}/5</label>
    <input id="ph" type="file" accept="image/*" multiple hidden>
    ${S.photos.map((s,i)=>`<div class="ph"><img src="${s}" alt="첨부 사진 ${i+1}"><button type="button" data-rmph="${i}" aria-label="사진 ${i+1} 삭제">×</button></div>`).join('')}
    ${S.photos.length?'':'<div class="muted" style="font-size:12px;align-self:center;line-height:1.5">사진을 올리면<br>후기에 함께 보여요</div>'}
  </div>
  <label style="display:flex;flex-direction:column;gap:6px" for="txt"><span style="font-size:14px;font-weight:700">사용 후기</span>
    <textarea id="txt" rows="4" placeholder="제형, 흡수감, 지속력, 자극 여부를 알려 주세요">${esc(S.draft)}</textarea><span class="err" id="err" hidden>후기를 10자 이상 적어 주세요.</span></label>
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:700">사용 기간</span>
    <div class="row">${['1주','2주','1개월','3개월+'].map(l=>`<button type="button" class="${pill(S.period===l)}" data-period="${l}">${l}</button>`).join('')}</div></div>
  <div style="background:var(--ok-bg);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:13px;color:#124D38">내 피부 정보 자동 첨부 · ${skinLabel()}</span><button class="link" type="button" data-go="profile" style="color:#124D38;font-size:12px">수정</button></div>
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:700">협찬·제공 여부 <span style="color:var(--rose)">(필수)</span></span>
    <div class="row" style="gap:8px">${[['no','직접 구매했어요'],['yes','협찬·제공받았어요']].map(([id,l])=>`<button type="button" class="${pill(S.ad===id)}" style="height:46px" data-ad="${id}">${l}</button>`).join('')}</div></div>
  </div><div class="foot"><button class="cta" type="button" data-act="submit">후기 등록 · 3개 언어로 자동 번역</button></div></div>`;
};

V.my=()=>{
  const ids={like:S.liked,recent:S.recent}[S.mytab];
  let items;
  if(S.mytab==='mine'){
    const mine=[...S.mine.map(r=>({sub:`★ ${r.score} · 방금 작성`,name:r.pname,c:r.pc,id:r.pid})),{sub:'★ 5.0 · 도움돼요 128',name:'히알루론 화장수',c:'JP',id:HERO},{sub:'★ 4.5 · 도움돼요 33',name:'세라마이드 미용액',c:'JP',id:byName('세라마이드 미용액').id},{sub:'★ 4.0 · 도움돼요 21',name:'판테놀 장벽 토너',c:'CN',id:byName('판테놀 장벽 토너').id}];
    items=mine;
  } else items=ids.map(id=>P[id]).map(p=>({sub:`${CN_[p.c]} · [${p.c} 브랜드]`,name:p.name,c:p.c,id:p.id}));
  const emptyMsg={like:'아직 찜한 제품이 없어요. 제품 상세에서 ♡를 눌러 보세요.',recent:'최근 본 제품이 없어요. 홈에서 제품을 눌러 보세요.'}[S.mytab];
  return `<div class="scr"><div class="body" style="padding:14px 16px 16px">
  <div class="top" style="padding:0 4px"><h1 style="font-size:20px;font-weight:900">마이페이지</h1><button class="ib" type="button" data-act="settings" aria-label="설정">${I.gear}</button></div>
  <div class="prof"><div style="display:flex;gap:14px;align-items:center"><div style="width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">${I.user('#E07A9C',28)}</div>
    <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0"><div style="display:flex;gap:6px;align-items:center"><span style="font-size:17px;font-weight:700">[닉네임]</span><span class="tag" style="color:var(--jp);background:#fff;padding:2px 8px">마니아 Lv.3</span></div><span style="font-size:13px;color:#5C4F58">${skinLabel()}</span></div>
    <button class="link" type="button" data-go="profile" style="color:var(--rose-deep);font-size:12px">수정</button></div>
    <div class="cmp-grid"><div class="stat"><b>${24+S.mine.length}</b><small>내 후기</small></div><div class="stat"><b>${(1204+S.helped.length).toLocaleString('ko-KR')}</b><small>도움돼요</small></div><div class="stat"><b>${(2350+S.mine.length*100).toLocaleString('ko-KR')}P</b><small>포인트</small></div></div></div>
  <div class="tabs" role="tablist">${[['like','찜한 제품'],['recent','최근 본'],['mine','내 후기']].map(([id,l])=>`<button type="button" role="tab" aria-selected="${S.mytab===id}" data-mytab="${id}" class="${S.mytab===id?'on':''}">${l}</button>`).join('')}</div>
  <div class="fade" style="display:flex;flex-direction:column;gap:8px">${items.length?items.map(i=>`<button class="li" type="button" data-open="${i.id}"><div style="width:44px;height:44px;border-radius:12px;background:${BG[i.c]}"></div><span style="flex:1;display:flex;flex-direction:column;min-width:0"><span class="muted" style="font-size:11px">${i.sub}</span><span style="font-size:14px;font-weight:700">${i.name}</span></span>${S.mytab==='like'?'<svg width="20" height="20" viewBox="0 0 24 24" fill="#E07A9C" stroke="#E07A9C" stroke-width="1.6"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>':'<span style="color:var(--mute)">›</span>'}</button>`).join(''):`<div class="empty">${emptyMsg}</div>`}</div>
  <div class="menu"><button type="button" data-go="profile">피부 프로필 관리 <span style="color:var(--mute)">›</span></button><button type="button" data-act="consent">개인정보 · 피부 정보 동의 관리 <span style="color:var(--mute)">›</span></button></div>
  </div>${nav('my')}</div>`;
};

/* ---------- render ---------- */
let lastRoute=null;
function render(animate){
  const r=route(), sc=app.querySelector('.body')?.scrollTop||0;
  app.innerHTML=V[r]();
  const b=app.querySelector('.body');
  if(r!==lastRoute){ if(animate){(b||app.firstElementChild).classList.add('fade');} if(b) b.scrollTop=0; }
  else if(b) b.scrollTop=sc;
  lastRoute=r;
  document.querySelectorAll('#jump button').forEach(x=>x.classList.toggle('on',x.dataset.go===r));
}
document.getElementById('jump').innerHTML=Object.entries(ROUTES).map(([k,l])=>`<button type="button" data-go="${k}">${l}</button>`).join('');

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.go){stack=[];go(d.go);return;}
  if(d.back!==undefined){back(d.back);return;}
  if(d.open){openP(d.open);return;}
  if(d.type){S.type=d.type;}
  else if(d.concern){S.concerns=S.concerns.includes(d.concern)?S.concerns.filter(x=>x!==d.concern):[...S.concerns,d.concern];}
  else if(d.ctry){S.countries=S.countries.includes(d.ctry)?S.countries.filter(x=>x!==d.ctry):[...S.countries,d.ctry];}
  else if(d.country){S.country=d.country;}
  else if(d.cat){S.cat=d.cat;save();if(route()!=='compare'){go('compare');return;}}
  else if(d.dtab){S.dtab=d.dtab;}
  else if(d.rvc){S.rvc=d.rvc;}
  else if(d.help){S.helped=S.helped.includes(d.help)?S.helped.filter(x=>x!==d.help):[...S.helped,d.help];}
  else if(d.shop){S.shop=+d.shop;}
  else if(d.mytab){S.mytab=d.mytab;}
  else if(d.star){S.star=+d.star;}
  else if(d.period){S.period=d.period;}
  else if(d.ad){S.ad=d.ad;}
  else if(d.rmph){S.photos.splice(+d.rmph,1);}
  else if(d.sheet){t.closest('.sheet-bg').remove(); if(d.sheet==='home'){stack=[];go('home');} if(d.sheet==='wipe'){const keep={...DEF(),liked:S.liked,recent:S.recent,mine:S.mine};S=keep;S.type='잘 모름';S.concerns=[];save();toast('피부 정보를 삭제했어요. 프로필에서 다시 고를 수 있어요.');render();} return;}
  else if(d.act){
    const a=d.act;
    if(a==='profile-done'){ if(S.type&&S.concerns.length&&S.countries.length){save();stack=[];go('home');toast(`${skinLabel()} 피부에 맞춰 후기를 골라 드릴게요`);} else toast('피부 고민과 관심 나라를 하나 이상 골라 주세요'); return;}
    if(a==='bell') {toast('새 알림이 없어요. 찜한 제품 가격이 바뀌면 알려 드릴게요.');return;}
    if(a==='settings') {toast('설정은 체험판에서 열리지 않아요');return;}
    if(a==='nextcat'){const k=Object.keys(SETS);S.cat=k[(k.indexOf(S.cat)+1)%k.length];}
    if(a==='like'){const id=S.cur;const on=S.liked.includes(id);S.liked=on?S.liked.filter(x=>x!==id):[id,...S.liked];save();render();app.querySelector('.heart')?.classList.add('beat');toast(on?'찜을 해제했어요':'찜한 제품에 담았어요 · 마이페이지에서 볼 수 있어요');return;}
    if(a==='tocompare'){S.cat=P[S.cur].cat;save();go('compare');toast(`${P[S.cur].name}을(를) 비교에 담았어요`);return;}
    if(a==='adoff'){S.adOff=!S.adOff;}
    if(a==='gobuy'){sheet('판매처로 이동','체험판이라 실제 판매처로 이동하지는 않아요. 정식 앱에서는 선택한 판매처 상품 페이지가 열려요.','홈으로 돌아가기','home');return;}
    if(a==='consent'){sheet('피부 정보 동의 관리','저장된 피부 정보: '+skinLabel()+'. 삭제하면 비슷한 피부 후기 매칭이 꺼져요.','피부 정보 삭제하기','wipe');return;}
    if(a==='submit'){
      const txt=(document.getElementById('txt').value||'').trim();
      if(txt.length<10){const er=document.getElementById('err');er.hidden=false;document.getElementById('txt').focus();return;}
      const p=P[S.cur];
      S.mine.unshift({c:'KR',user:'나 ([닉네임])',skin:skinLabel(),score:S.star.toFixed(1),text:txt,trans:'한국어 원문 · 中/日 자동 번역됨',help:0,mania:true,ad:S.ad==='yes',imgs:S.photos.slice(0,3),pname:p.name,pc:p.c,pid:p.id});
      S.photos=[];S.draft='';S.rvc='ALL'; if(S.ad==='yes') S.adOff=false;
      try{save();}catch(e){}
      stack=[];go('reviews');toast('후기를 등록했어요 · 중국어·일본어로도 보여요');return;
    }
    if(a==='reset'){try{localStorage.removeItem('glow-demo');}catch(e){} S=DEF();stack=[];location.hash='splash';render();toast('처음 상태로 되돌렸어요');return;}
  } else return;
  save(); render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;document.getElementById('hits').innerHTML=hitsHTML();}
  if(e.target.id==='txt'){S.draft=e.target.value;document.getElementById('err').hidden=true;save();}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='ph') return;
  const files=[...e.target.files].slice(0,5-S.photos.length);
  Promise.all(files.map(f=>new Promise(res=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,240/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8));};img.onerror=()=>res(null);img.src=u;})))
    .then(r=>{S.photos.push(...r.filter(Boolean));render();});
});

if(QR_DATA.startsWith('data:')){document.getElementById('qrimg').src=QR_DATA;document.getElementById('qrbox').hidden=false;}
render();
</script>

</body>
</html>
